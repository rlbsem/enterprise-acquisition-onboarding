name: Verify native HubSpot read-only adapter
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hubspot-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install test-only pinned tools (no HubSpot credential)
        run: python -m pip install httpx==0.28.1 pytest==9.0.3 ruff==0.14.2
      - name: Ruff lint (bounded adapter only)
        run: python -m ruff check src/onboarding/hubspot_native.py tests/test_hubspot_native.py
      - name: Ruff format (bounded adapter only)
        run: python -m ruff format --diff src/onboarding/hubspot_native.py tests/test_hubspot_native.py
      - name: Mocked provider contract and failure matrix
        run: python -m pytest -q tests/test_hubspot_native.py
