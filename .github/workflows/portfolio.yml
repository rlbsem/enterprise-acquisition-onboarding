name: Multi-company scale acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: portfolio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  isolated-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - name: Bind exact execution sources
        run: |
          mkdir -p .local/portfolio-container-evidence
          python scripts/verify_portfolio.py --write-binding --output .local/portfolio-binding.json
          sudo chown 10001:"$(id -g)" .local/portfolio-container-evidence
          sudo chmod 0775 .local/portfolio-container-evidence
      - name: Build existing acceptance image
        run: docker build --target acceptance --tag acquisition-scale:${{ github.sha }} .
      - name: Execute PostgreSQL, HTTP, dbt and browser acceptance
        run: |
          docker create --name acquisition-scale --network none --read-only --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true --memory 3g --cpus 2 --pids-limit 512 --tmpfs /state:size=2147483648,uid=10001,gid=10001 --tmpfs /tmp:size=536870912,mode=1777 --tmpfs /var/run/postgresql:size=4194304,mode=1777 --tmpfs /var/lib/postgresql/data:size=4194304,uid=10001,gid=10001 --mount type=bind,source="$PWD/scripts",target=/opt/acquisition/scripts,readonly --mount type=bind,source="$PWD/tests",target=/opt/acquisition/tests,readonly --mount type=bind,source="$PWD/.local/portfolio-binding.json",target=/binding.json,readonly --mount type=bind,source="$PWD/.local/portfolio-container-evidence",target=/evidence --entrypoint python acquisition-scale:${{ github.sha }} scripts/verify_portfolio.py --workspace /state/verification --output /evidence/run --sizes 3 10 25 50 --repeats 1 --browser --binding-file /binding.json
          docker start --attach acquisition-scale
          test "$(docker inspect --format '{{.State.ExitCode}}' acquisition-scale)" = 0
      - name: Inspect actual containment
        if: always()
        run: |
          docker inspect acquisition-scale > .local/portfolio-container-evidence/container-inspection.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.local/portfolio-container-evidence/container-inspection.json').read_bytes())[0]
          h=c['HostConfig']
          assert c['State']['Pid']==0 and not c['State']['Running'] and c['State']['ExitCode']==0
          assert c['Config']['User']=='10001:10001' and h['ReadonlyRootfs']
          assert h['NetworkMode']=='none' and not h['PortBindings']
          assert h['CapDrop']==['ALL'] and not h['Privileged']
          assert h['Memory']==3221225472 and h['NanoCpus']==2000000000 and h['PidsLimit']==512
          assert not any(m['Type']=='volume' for m in c['Mounts'])
          PY
      - name: Remove exact acceptance container
        if: always()
        run: |
          docker rm --force --volumes acquisition-scale
          test -z "$(docker ps -aq --filter name='^/acquisition-scale$')"
          echo '{"acceptance_container_absent":true,"published_ports":0,"volumes_created":0}' > .local/portfolio-container-evidence/teardown.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: multi-company-container-evidence
          path: .local/portfolio-container-evidence/
          retention-days: 30
