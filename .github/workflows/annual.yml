name: Annual financial scenario
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: annual-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  annual-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.lock
      # The hosted Ubuntu image includes Chrome's Linux libraries. Install the
      # pinned Playwright browser without an unrelated apt upgrade transaction.
      - run: python -m playwright install chromium
        timeout-minutes: 5
      - run: python scripts/verify_annual.py --workspace .local/annual-ci --output .local/annual-evidence
      - run: python scripts/check_annual_evidence.py .local/annual-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: annual-financial-evidence
          path: .local/annual-evidence/
          if-no-files-found: warn
          retention-days: 14
