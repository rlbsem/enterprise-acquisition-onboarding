name: Portable demo acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  compose-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.lock
      - name: Verify preserved portable records
        run: |
          python scripts/check_portable_evidence.py docs/evidence/portable/native-run01
          python scripts/check_portable_evidence.py docs/evidence/portable/compose-run01
          python scripts/check_portable_evidence.py docs/evidence/portable/failed-network-run01 --failed
      - run: python scripts/verify_portable.py --workspace .local/compose-ci --output .local/compose-evidence
      - run: python scripts/check_portable_evidence.py .local/compose-evidence --working-tree
      - name: Safe failure summary
        if: failure()
        run: |
          python -c "import json; from pathlib import Path; p=Path('.local/compose-evidence/portable.json'); r=json.loads(p.read_text()) if p.exists() else {}; print(json.dumps({k:r.get(k) for k in ['status','error_type','cleanup']}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-demo-evidence
          path: .local/compose-evidence/
          if-no-files-found: warn
          retention-days: 14
