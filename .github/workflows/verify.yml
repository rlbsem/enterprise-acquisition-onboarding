name: Verify admission foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admission-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  postgres-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONBOARDING_TEST_ADMIN_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_repository.py
      - run: python scripts/verify.py --workspace .local/ci --output .local/ci-evidence
      - if: failure()
        run: python scripts/ci_failure_summary.py
