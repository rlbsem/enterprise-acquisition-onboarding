[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-acquisition-onboarding"
version = "0.1.0"
description = "Governed source intake and reconciliation-based acquisition admission"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.38.0", "httpx==0.28.1", "psycopg[binary]==3.2.12", "pydantic==2.12.3", "dbt-core==1.11.0", "dbt-postgres==1.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onboarding = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
